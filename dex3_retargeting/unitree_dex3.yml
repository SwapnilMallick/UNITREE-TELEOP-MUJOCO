## Adapted from unitreerobotics/xr_teleoperate's assets/unitree_hand/unitree_dex3.yml
## for the upstream dex_retargeting package (dexsuite/dex-retargeting), not the
## Unitree-forked pin -- see CLAUDE.md's "Teleop Input" for why (the fork's pinned
## nlopt<2.8.0 has no arm64 macOS wheel and fails to build from source here even
## with cmake/swig installed; upstream's nlopt>=2.8.0 installs cleanly).
##
## The only real change from the original file: upstream's RetargetingConfig
## consolidated three separate per-type fields (target_link_human_indices_position/
## _vector/_dexpilot) into one field, target_link_human_indices. Since `type:
## DexPilot` is what's actually active here (never `vector`), this file keeps
## only the DexPilot-relevant fields and drops the vector-only ones
## (target_origin_link_names/target_task_link_names/target_link_human_indices_vector/
## scaling_factor), which the original file carried but never used for this type.
## Nothing else changed -- same joint order, same URDF paths, same DexPilot indices,
## same low_pass_alpha.
left:
  type: DexPilot
  urdf_path: unitree_hand/unitree_dex3_left.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names:
    [
      "left_hand_thumb_0_joint",
      "left_hand_thumb_1_joint",
      "left_hand_thumb_2_joint",
      "left_hand_middle_0_joint",
      "left_hand_middle_1_joint",
      "left_hand_index_0_joint",
      "left_hand_index_1_joint",
    ]

  wrist_link_name: "base_link"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip"]
  # If you do not know exactly how it is used, please leave it to None for default.
  target_link_human_indices: [[ 9, 14, 14, 0, 0, 0], [ 4, 4, 9, 4, 9, 14]]

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2

right:
  type: DexPilot
  urdf_path: unitree_hand/unitree_dex3_right.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names:
    [
      "right_hand_thumb_0_joint",
      "right_hand_thumb_1_joint",
      "right_hand_thumb_2_joint",
      "right_hand_index_0_joint",
      "right_hand_index_1_joint",
      "right_hand_middle_0_joint",
      "right_hand_middle_1_joint",
    ]

  wrist_link_name: "base_link"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip"]
  target_link_human_indices: [[ 9, 14, 14, 0, 0, 0], [ 4, 4, 9, 4, 9, 14]]

  low_pass_alpha: 0.2
